name: Delete a published post

on:
  workflow_dispatch:
    inputs:
      media_id:
        description: "The ig_media_id to delete (from queue.json)"
        required: true
        type: string

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Delete post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_ID: ${{ inputs.media_id }}
        run: python scripts/delete_post.py
